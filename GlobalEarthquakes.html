<!DOCTYPE html>
<html>

  <head>

    <meta charset='utf-8' />

    <title>Global Earthquakes Map</title>

    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

    <!--    Reference to the Mapbox JavaScript in the <head> of the page  -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
          
    <!--    Reference to the Mapbox CSS in between <head> tags    -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">

    <style>
      /* Additional CSS code   */
      body { margin:0; padding:0; }
      #map { position:absolute; top:0; bottom:0; width:100%; }  
        #banner { z-index: 9999; 
        background-color:white; 
        opacity: 80%; 
        text-align: center 
      }

    </style>

  </head>

  <body>

    <!--  Map div in body  -->
    <div id='map'></div>

    <!--  Title div in body -->
    <div id='banner'>

     	<h1>Map of Global Earthquakes in 2021</h1>
     	<h2>Joshua Mason</h2>
      
 	  </div>
    
    <script>
        // Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1Ijoiam9zaHVhdG1hc29uIiwiYSI6ImNtbmh5a3IzdjA3Z2oycnE1c2R0bWRxMWQifQ.nygTHzVrREgrtl_DBWkLmg';
 
        // Initializing map
        var map = new mapboxgl.Map({
          container: 'map', // id of a div on your page, where the map will be inserted
          style: 'mapbox://styles/joshuatmason/cmodg3kik005001rp5kmh9auv', // stylesheet location mapbox://styles/mapbox/light-v11
          center: [-103.7775, 44.9672], // starting position [lng, lat] eg. [-122.6788, 45.5212]
          zoom: 2 // starting zoom 
        });

        // Adding zoom controls
        map.addControl(new mapboxgl.NavigationControl({
          showCompass: false
          }), 'bottom-left');
        
    </script>

  </body>

</html>
